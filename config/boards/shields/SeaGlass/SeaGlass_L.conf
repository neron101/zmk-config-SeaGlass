CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y

# 充電インジケータ設定
CONFIG_CHARGE_INDICATOR=y
CONFIG_CHG_BATTERY_LEVEL_BASED_COLOR=y
CONFIG_CHG_BATTERY_LEVEL_HIGH=80
CONFIG_CHG_BATTERY_LEVEL_LOW=40
CONFIG_CHG_BATTERY_LEVEL_CRITICAL=10

# ===== スリープ: 1時間無操作でディープスリープ =====
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# ===== 電波強化 =====
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ========== DYA Studio (Peripheral) ==========
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
